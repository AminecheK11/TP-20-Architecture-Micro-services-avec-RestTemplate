server:
  port: 8888
spring:
  application:
    name: GATEWAY
  cloud:
    gateway:
      server:
        webflux:
          discovery:
            locator:
              enabled: true
              lower-case-service-id: false
              include-expression: "serviceId == 'SERVICE-CLIENT' or serviceId == 'SERVICE-CAR'"
eureka:
  client:
    register-with-eureka: true
    fetch-registry: true
    service-url:
      defaultZone: http://localhost:8761/eureka/
  instance:
    prefer-ip-address: true
    instance-id: ${spring.application.name}:${server.port}
management:
  endpoints:
    web:
      exposure:
        include: health,info,gateway
  endpoint:
    gateway:
      access: read-only
logging:
  level:
    org.springframework.cloud.gateway: INFO
